<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmable Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
        }

        .timer-flow {
            position: relative;
            padding-bottom: 100px;
        }

        .boxes-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        .timer-box {
            width: 150px;
            height: 100px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
        }

        .timer-box select {
            width: 100%;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            background-color: white;
            cursor: pointer;
        }

        .timer-box select:focus {
            outline: 2px solid #4CAF50;
            border-color: #4CAF50;
        }

        /* Forward arrows between boxes */
        .arrow {
            position: relative;
            width: 50px;
            height: 2px;
            background-color: #333;
            flex-shrink: 0;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -4px;
            width: 0;
            height: 0;
            border-left: 10px solid #333;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        /* Return path container */
        .return-path {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            height: 100px;
        }

        /* Return arrow segments */
        .return-segment {
            position: absolute;
            background-color: #333;
            pointer-events: none;
        }

        /* Segment 1: Short horizontal line going right from last box */
        .segment-right {
            right: -30px;
            top: 0;
            width: 30px;
            height: 2px;
        }

        /* Segment 2: Vertical line going down */
        .segment-down {
            right: -30px;
            top: 0;
            width: 2px;
            height: 80px;
        }

        /* Segment 3: Long horizontal line going left */
        .segment-left {
            left: -30px;
            right: -30px;
            top: 78px;
            height: 2px;
        }

        /* Segment 4: Vertical line going up */
        .segment-up {
            left: -30px;
            top: 0;
            width: 2px;
            height: 80px;
        }

        /* Segment 5: Short horizontal line going right to first box with arrowhead */
        .segment-final {
            left: -30px;
            top: 0;
            width: 30px;
            height: 2px;
        }

        .segment-final::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -4px;
            width: 0;
            height: 0;
            border-left: 10px solid #333;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        /* Checkbox to toggle return arrow */
        .return-toggle {
            position: absolute;
            right: 5px;
            top: -5px;
            z-index: 10;
            cursor: pointer;
            width: 18px;
            height: 18px;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-flow">
            <div class="boxes-row">
                <div class="timer-box">
                    <select class="action-select">

                    <select class="time-select">

                        <option value="20:00">20:00</option>
                        <option value="15:00">15:00</option>

                    </select>
                </div>
                <div class="arrow"></div>
                <div class="timer-box">
                    <select class="action-select">
                        <option value=""></option>
                        <option value="wait">Wait for</option>
                        <option value="on">On for</option>
                        <option value="off">Off for</option>
                    </select>
                    <select class="time-select">

                        <option value="15:00">15:00</option>
                        <option value="10:00">10:00</option>
                        <option value="5:00">5:00</option>
                    </select>
                </div>
                <div class="arrow"></div>

                        <option value="wait">Wait for</option>
                        <option value="on">On for</option>

                    </select>
                </div>
            </div>
            
            <div class="return-path">
                <input type="checkbox" id="return-toggle" class="return-toggle" checked>
                <div class="return-segment segment-right"></div>
                <div class="return-segment segment-down"></div>
                <div class="return-segment segment-left"></div>
                <div class="return-segment segment-up"></div>
                <div class="return-segment segment-final"></div>
            </div>
        </div>
    </div>

    <script>
        // Toggle return arrow visibility
        const toggleCheckbox = document.getElementById('return-toggle');
        
        toggleCheckbox.addEventListener('change', function() {
            const segments = document.querySelectorAll('.return-segment');
            segments.forEach(segment => {
                segment.style.display = this.checked ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
