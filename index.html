<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmable Timer</title>
    <style>
        :root {
            --return-offset: 75px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
        }

        .timer-flow {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .timer-box {
            width: 150px;
            height: 100px;
            background-color: white;
            border: 2px solid #333;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .arrow {
            position: relative;
            width: 50px;
            height: 2px;
            background-color: #333;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: -8px;
            top: -4px;
            width: 0;
            height: 0;
            border-left: 10px solid #333;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        .return-path {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .vertical-arrow {
            position: absolute;
            right: 0;
            top: 0;
            width: 2px;
            height: 60px;
            background-color: #333;
        }

        .vertical-arrow::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -4px;
            width: 0;
            height: 0;
            border-top: 10px solid #333;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
        }

        .horizontal-return-arrow {
            position: absolute;
            bottom: 0;
            left: 0;
            right: var(--return-offset);
            height: 2px;
            background-color: #333;
        }

        .horizontal-return-arrow::before {
            content: '';
            position: absolute;
            left: -8px;
            top: -4px;
            width: 0;
            height: 0;
            border-right: 10px solid #333;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        .return-connector {
            position: relative;
            width: 100%;
            height: 80px;
            margin-top: -20px;
        }

        .return-line {
            position: absolute;
            background-color: #333;
        }

        .vertical-down {
            right: var(--return-offset);
            top: 0;
            width: 2px;
            height: 40px;
        }

        .horizontal-back {
            left: 0;
            right: var(--return-offset);
            bottom: 20px;
            height: 2px;
        }

        .horizontal-back::before {
            content: '';
            position: absolute;
            left: -8px;
            top: -4px;
            width: 0;
            height: 0;
            border-right: 10px solid #333;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        .vertical-down::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -4px;
            width: 0;
            height: 0;
            border-top: 10px solid #333;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
        }

        .corner {
            position: absolute;
            right: var(--return-offset);
            bottom: 20px;
            width: 2px;
            height: 2px;
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer-flow">
            <div class="top-row">
                <div class="timer-box"></div>
                <div class="arrow"></div>
                <div class="timer-box"></div>
                <div class="arrow"></div>
                <div class="timer-box"></div>
                <div class="arrow"></div>
                <div class="timer-box"></div>
                <div class="arrow"></div>
                <div class="timer-box"></div>
            </div>
            <div class="return-connector">
                <div class="return-line vertical-down"></div>
                <div class="return-line horizontal-back"></div>
            </div>
        </div>
    </div>
</body>
</html>
